<script>
const person=document.querySelector('.person');
const head=document.createElementNS('http://www.w3.org/2000/svg','g');
head.setAttribute('class','chibi-head');
let collecting=false;
for(const node of Array.from(person.childNodes)){
 if(node.nodeType===8 && node.textContent.includes('neck and soft')) collecting=true;
 if(node.nodeType===8 && node.textContent.includes('crossbody bag')) break;
 if(collecting) head.appendChild(node);
}
person.appendChild(head);
document.getElementById('replay').addEventListener('click',()=>{
 for(const animation of document.querySelector('.scene').getAnimations({subtree:true})) animation.currentTime=0;
});
