<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17120f;color:#fff7ed;font-family:system-ui,sans-serif}
.stage{position:relative;width:100%;height:100%;min-height:480px;display:grid;place-items:center;isolation:isolate;background:radial-gradient(ellipse at 37% 47%,#573014 0,#25170f 43%,#100d0b 100%)}
.stage:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffedd533 1px,transparent 1.5px),radial-gradient(#fdba7466 1px,transparent 1.5px);background-size:72px 72px,137px 137px;background-position:0 0,31px 42px;opacity:.32}
.scene{position:relative;width:min(900px,96vw);height:480px;isolation:isolate}
.halo{position:absolute;left:7%;top:8%;width:55%;height:82%;border-radius:50%;background:radial-gradient(ellipse,#fb923c55,#facc1533 40%,transparent 72%);filter:blur(15px);animation:pulse 1.8s ease-in-out infinite alternate}
.rail{position:absolute;z-index:1;left:8%;right:45%;top:39%;height:13px;border:3px solid #fef3c7;border-radius:999px;background:linear-gradient(#64748b,#1e293b);box-shadow:0 4px 0 #7c2d12,0 0 18px #fdba7488;transform-origin:left center;animation:rail 15s linear both}.person{position:absolute;z-index:2;left:15%;top:calc(50% - 215px);width:clamp(230px,29vw,320px);height:auto;overflow:visible;filter:drop-shadow(0 10px 12px #11182799) drop-shadow(0 0 14px #f9731688);animation:drop 15s cubic-bezier(.2,.7,.25,1) both;transform-origin:50% 12%;backface-visibility:visible}
.speech{position:absolute;z-index:3;left:39%;top:23%;width:min(470px,55vw);padding:17px 23px;border:3px solid #fff7ed;border-radius:25px 25px 25px 7px;background:linear-gradient(145deg,#fff7dd,#fed7aa);box-shadow:0 0 0 4px #f97316,0 12px 30px #43140788;color:#431407;font-size:clamp(18px,2.5vw,27px);line-height:1.15;font-weight:950;text-align:center;opacity:0;transform:translateY(18px) scale(.8);animation:speech 15s ease both}
.speech:after{content:"";position:absolute;left:-13px;bottom:18px;width:20px;height:20px;background:#fff0d5;border-left:3px solid #fff7ed;border-bottom:3px solid #fff7ed;transform:rotate(45deg)}
.speech small{display:block;margin-top:6px;font-size:12px;letter-spacing:.08em;color:#9a3412}
.qr-card{position:absolute;z-index:4;left:27%;top:57%;width:clamp(190px,25vw,260px);padding:13px 14px 11px;border:4px solid #fff;border-radius:22px;background:linear-gradient(145deg,#fffdf6,#ffedd5);box-shadow:0 0 0 5px #f59e0b,0 0 34px #fb923caa,0 16px 32px #43140777;text-align:center;opacity:0;transform:scale(.08) rotate(-12deg);transform-origin:top left;animation:qr 15s cubic-bezier(.2,.8,.2,1) both}
.qr-card strong{display:block;margin-bottom:8px;color:#7c2d12;font-size:17px;font-weight:950}
.qr-card img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:white;border:6px solid white;border-radius:9px}
.qr-card span{display:block;margin-top:7px;color:#9a3412;font-size:10px;font-weight:800;overflow-wrap:anywhere}
.crumb{position:absolute;z-index:1;font-size:27px;opacity:0;filter:drop-shadow(0 2px 3px #92400e66);animation:crumb 15s ease-out both}
.crumb:nth-of-type(1){left:8%;top:25%;--dx:-80px;--dy:-90px}.crumb:nth-of-type(2){left:26%;top:32%;--dx:100px;--dy:-120px;animation-delay:.1s}.crumb:nth-of-type(3){left:16%;top:55%;--dx:-115px;--dy:30px;animation-delay:.2s}
@keyframes rail{0%,27%{opacity:1;transform:scaleX(1)}34%,100%{opacity:0;transform:scaleX(.35)}}@keyframes drop{0%{transform:translate3d(0,-115vh,0) rotateY(165deg) rotateZ(-8deg) scale(.96);opacity:1}9%{transform:translate3d(0,-18px,0) rotateY(165deg) rotateZ(-4deg) scale(1);opacity:1}17%,25%{transform:translate3d(0,-18px,0) rotateY(165deg) rotateZ(2deg) scale(1);opacity:1}29%{transform:translate3d(0,-48px,0) rotateY(145deg) rotateZ(-8deg);opacity:1}34%{transform:translate3d(0,-12px,0) rotateY(90deg) rotateZ(14deg);opacity:1}39%{transform:translate3d(0,0,0) rotateY(20deg) rotateZ(82deg) scale(1,.78);opacity:1}42%{transform:translate3d(0,-18px,0) rotateY(0) rotateZ(-12deg) scale(1,1.08);opacity:1}46%{transform:translate3d(0,0,0) rotateY(0) rotateZ(4deg);opacity:1}50%,88%{transform:translate3d(0,0,0) rotateY(0) rotateZ(0);opacity:1}92%{transform:translate3d(100px,0,0) rotateY(0) rotateZ(8deg);opacity:1}100%{transform:translate3d(125vw,20px,0) rotateY(0) rotateZ(12deg);opacity:1}}
.grip-arm{transform-box:fill-box;transform-origin:top right;animation:grip 15s ease-in-out both}@keyframes grip{0%,8%{transform:rotate(0)}13%,25%{transform:rotate(-142deg)}29%{transform:rotate(-118deg)}33%{transform:rotate(-82deg)}38%,50%{transform:rotate(0)}58%,65%{transform:rotate(18deg)}69%{transform:rotate(56deg)}74%,82%{transform:rotate(-84deg)}87%,100%{transform:rotate(0)}}
.rub-arm{transform-box:fill-box;transform-origin:top left;animation:rub 15s ease-in-out both}@keyframes rub{0%,47%,100%{transform:rotate(0)}51%,53%,56%,59%{transform:rotate(-68deg)}64%{transform:rotate(0)}68%,72%{transform:rotate(38deg)}76%,82%{transform:rotate(-76deg)}86%{transform:rotate(0)}}
.head{transform-box:fill-box;transform-origin:center bottom;animation:head 15s ease-in-out both}@keyframes head{0%,47%,100%{transform:rotate(0)}50%,54%,58%,62%{transform:rotate(-7deg)}52%,56%,60%{transform:rotate(7deg)}}
.mouth-open{animation:mouth 15s linear both}@keyframes mouth{0%,57%{opacity:0}60%,69%{opacity:1}72%,100%{opacity:0}}
.mouth-smile{animation:smile 15s linear both}@keyframes smile{0%,57%{opacity:1}60%,69%{opacity:0}72%,100%{opacity:1}}
@keyframes speech{0%,55%{opacity:0;transform:translateY(18px) scale(.72)}59%,69%{opacity:1;transform:translateY(0) scale(1)}73%,100%{opacity:0;transform:translateY(-8px) scale(.92)}}
@keyframes qr{0%,67%{left:27%;top:57%;opacity:0;transform:scale(.08) rotate(-12deg)}70%{left:31%;top:53%;opacity:1;transform:scale(.3) rotate(-5deg)}76%{left:43%;top:12%;opacity:1;transform:scale(1.08) rotate(3deg)}79%,84%{left:43%;top:12%;opacity:1;transform:scale(1) rotate(0)}88%{left:29%;top:55%;opacity:.75;transform:scale(.2) rotate(8deg)}91%,100%{left:27%;top:57%;opacity:0;transform:scale(.05) rotate(12deg)}}
@keyframes crumb{0%,8%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}30%{opacity:.9;transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(100deg)}42%,100%{opacity:0;transform:translate(calc(var(--dx)*1.4),calc(var(--dy)*1.3)) scale(.4) rotate(200deg)}}
@keyframes pulse{to{transform:scale(1.12);opacity:.75}}
.caption{position:absolute;bottom:17px;left:0;right:0;text-align:center;color:#fed7aa;font-size:12px;letter-spacing:.12em}
@media(max-width:620px){.scene{height:390px}.person{left:5%;top:calc(50% - 185px);width:50vw}.speech{left:35%;top:22%;width:60vw;padding:12px 15px}.qr-card{left:38%;top:18%;width:45vw;padding:8px}.qr-card strong{font-size:13px}}
@media(prefers-reduced-motion:reduce){.person,.speech,.qr-card,.crumb,.grip-arm,.rub-arm,.head{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head>
