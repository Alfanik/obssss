<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif;background:#101321;color:#fff;overflow:hidden}
.stage{height:100%;min-height:460px;position:relative;display:grid;place-items:center;isolation:isolate;background:radial-gradient(ellipse at 50% 55%,#30234d 0,#17182b 45%,#0b0d17 100%)}
.stage:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff9 1px,transparent 1.5px),radial-gradient(#c4b5fd99 1px,transparent 1.5px);background-size:83px 83px,137px 137px;background-position:0 0,31px 42px;opacity:.36;mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.glow{position:absolute;width:min(64vw,760px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#a855f72b,transparent 68%);animation:pulse 2.6s ease-in-out infinite alternate}
.scene{width:min(1080px,98vw);height:min(470px,86vh);min-height:350px;display:flex;align-items:center;justify-content:center;gap:12px;position:relative;z-index:1;filter:drop-shadow(0 20px 25px #03040b99);animation:flyby 13s cubic-bezier(.42,0,.25,1) both}.scene:before{content:"";position:absolute;z-index:0;inset:8% 4%;border-radius:50%;background:radial-gradient(ellipse,#d946ef44,#38bdf822 44%,transparent 72%);filter:blur(15px);animation:pulse 1.7s ease-in-out infinite alternate}.scene:after{content:"";position:absolute;z-index:0;left:-32%;right:58%;top:48%;height:55px;background:repeating-linear-gradient(174deg,transparent 0 10px,#fb923ce8 11px 14px,#fde68a99 15px 17px,transparent 18px 29px);filter:blur(2px);opacity:0;animation:jettrail 13s ease-out both}.scene>*{z-index:2}.impact{position:absolute;z-index:1!important;width:16px;height:16px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 10px #fb718599,0 0 38px 20px #c026d366;opacity:0;pointer-events:none;animation:impact 13s ease-out both}.person{filter:saturate(1.35) contrast(1.15) drop-shadow(0 0 13px #fb315eaa) drop-shadow(0 12px 12px #03040b99)}.scene:before{background:radial-gradient(ellipse,#f0abfc66,#fb718533 35%,#38bdf833 55%,transparent 75%);filter:blur(11px)}.scene svg path[d^="M62 294"],.scene svg path[d^="M81 297"]{transform-box:fill-box;transform-origin:center;animation:flameflicker .18s ease-in-out infinite alternate}@keyframes impact{0%,31%{transform:scale(.1);opacity:0}34%{transform:scale(2);opacity:1}39%{transform:scale(30);opacity:.65}48%,100%{transform:scale(38);opacity:0}}@keyframes flameflicker{from{transform:scaleY(.78) skewX(-4deg);filter:brightness(1)}to{transform:scaleY(1.2) skewX(5deg);filter:brightness(1.8)}}
.person{width:clamp(205px,27vw,310px);height:auto;flex:none;animation:bob 1.15s ease-in-out infinite alternate;filter:drop-shadow(0 0 10px #fb718566) drop-shadow(0 10px 10px #03040b80)}
.sign{width:clamp(230px,31vw,360px);padding:15px 18px 14px;border:5px solid #fff;border-radius:25px;background:linear-gradient(145deg,#fffefa,#ffe8ad 72%,#ffd36f);box-shadow:0 0 0 5px #fbbf24,0 0 32px #fbbf2480,0 16px 38px #05020b70;display:flex;flex-direction:column;align-items:center;gap:9px;transform-style:preserve-3d;backface-visibility:hidden;animation:turn 13s cubic-bezier(.2,.8,.2,1) both}
.title{font-weight:950;font-size:clamp(18px,2.3vw,25px);line-height:1.05;text-align:center;color:#38215f}
.qr{width:clamp(135px,17vw,176px);height:clamp(135px,17vw,176px);object-fit:contain;background:#fff;border:7px solid white;border-radius:14px;box-shadow:0 3px 15px #1e293b40}
.link{font-size:14px;font-weight:850;color:#51406d}
.spark{position:absolute;font-size:31px;color:#fde68a;animation:twinkle 1.2s ease-in-out infinite alternate}
.spark:nth-child(2){left:7%;top:18%}.spark:nth-child(3){left:43%;top:7%;color:#f472b6;animation-delay:.4s}.spark:nth-child(4){right:5%;bottom:16%;color:#7dd3fc;animation-delay:.7s}.spark:nth-child(5){right:22%;top:13%;color:#c4b5fd;animation-delay:.2s}
.caption{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#c4b5fd;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
@keyframes jettrail{0%,8%{opacity:0;transform:translateX(35%)}13%,30%{opacity:.9;transform:translateX(0)}34%,100%{opacity:0;transform:translateX(-35%)}}@keyframes flyby{0%{transform:translate3d(112vw,42px,0) rotate(8deg) scale(.75);opacity:0}8%{opacity:1}34%{transform:translate3d(0,0,0) rotate(0) scale(1);opacity:1}68%{transform:translate3d(0,-3px,0) rotate(0) scale(1);opacity:1}100%{transform:translate3d(-125vw,-18px,0) rotate(-8deg) scale(.82);opacity:0}}
@keyframes turn{0%,33%{transform:rotateY(88deg) rotateZ(5deg) scale(.86);opacity:.3}43%,66%{transform:rotateY(0) rotateZ(0) scale(1);opacity:1}76%,84%{transform:rotateY(180deg) rotateZ(-3deg) scale(.94);opacity:.8}92%,100%{transform:rotateY(360deg) rotateZ(0) scale(1);opacity:1}}
@keyframes bob{from{transform:translateY(-5px) rotate(-1deg)}to{transform:translateY(5px) rotate(1deg)}}@keyframes twinkle{from{transform:scale(.65) rotate(-12deg);opacity:.48}to{transform:scale(1.2) rotate(12deg);opacity:1}}@keyframes pulse{to{transform:scale(1.14);opacity:.6}}
@media(max-width:620px){.scene{height:340px;min-height:310px;gap:2px}.sign{padding:9px;border-width:3px;border-radius:17px}.link{font-size:10px}.person{width:42vw}.caption{bottom:10px}}
@media(prefers-reduced-motion:reduce){.scene,.sign,.person,.spark,.glow{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
